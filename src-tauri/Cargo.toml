[package]
name = "gs8-simulations"
version = "0.1.0"
description = "Offline desktop shell for GS8 simulations"
authors = ["beta-works"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[lib]
name = "gs8_simulations_lib"
crate-type = ["staticlib", "cdylib", "rlib"]
